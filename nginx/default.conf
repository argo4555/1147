# Статическая раздача демо-сайта 1147 Detailing. Порт 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain;

    server_tokens off;
    absolute_redirect off;   # за прокси Railway редирект /admin -> /admin/ остаётся относительным
    port_in_redirect off;

    # Демо не должно конкурировать с действующим сайтом в поиске
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-src https://yandex.ru https://yandex.com; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Шрифты и картинки меняются редко
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
    }

    # CSS и JS без хешей в имени — короткий кеш
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 10m;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
